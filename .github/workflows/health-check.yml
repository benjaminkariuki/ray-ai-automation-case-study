# Daily public health check for Task 1.
# Runs one hour after the n8n schedule (06:00 UTC). It:
#   1. pings the n8n server
#   2. runs verify_sheet.py against the live, public Google Sheet (requirements + "ran in the last 30 hours")
# A failure turns the badge red and GitHub emails the repo owner, so problems are noticed within a day.
name: Task 1 health check

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: n8n server is up
        run: |
          curl -fsS --max-time 30 https://ray-n8n-bk.southafricanorth.cloudapp.azure.com/healthz/readiness
          echo

      - name: Google Sheet meets every Task 1 requirement
        run: python task1-job-outreach/scripts/verify_sheet.py
